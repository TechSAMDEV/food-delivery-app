<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f7f7f7;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .success {
            color: green;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .details {
            margin-top: 20px;
        }

        a.button {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #ff7a00;
            color: white;
            padding: 10px 14px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="success">✅ Order placed successfully!</div>
            <h1>Thank you for your order</h1>

            <div class="details">
                <p><strong>Order ID:</strong> #{{ order.id }}</p>
                <p><strong>Status:</strong> {{ order.get_status_display }}</p>
                <p><strong>Total Amount:</strong> ₦{{ order.total_amount }}</p>
                <p><strong>Order Type:</strong> {{ order.get_order_type_display }}</p>
            </div>

            <a class="button" href="{% url 'store:menu_list' %}">Back to menu</a>
        </div>
    </div>
</body>

</html>
